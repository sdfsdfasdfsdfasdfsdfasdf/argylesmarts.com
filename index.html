<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argyle Smarts</title>
<style>
.t-mem{background:linear-gradient(135deg,#132a3a 0%,#18405a 60%,#1f5a78 100%)}
.t-mem .label{color:#e6f6ff}
.mc{position:absolute;width:42px;height:56px;border-radius:8px;background:#1b1e36;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}
.mc svg{width:60%;height:60%}
.mc1{left:7%;top:50%;transform:translateY(-50%) rotate(-10deg)}
.mc2{left:17%;top:50%;transform:translateY(-50%) rotate(6deg)}
.mc3{right:9%;top:50%;transform:translateY(-50%) rotate(9deg);background:linear-gradient(145deg,#1d2142,#16182e)}
.t-snake{background:repeating-conic-gradient(#aad751 0% 25%,#a2d149 0% 50%) 0 0/46px 46px;border-color:#7fae3a}
.t-snake .label{color:#1f3d12}
.t-snake .art svg{inset:0;width:100%;height:100%}
.t-megs{background:linear-gradient(180deg,#141a3a 0%,#3d3566 42%,#d9785a 62%,#434b69 62%,#394159 100%);border-color:#4b5380}
.t-megs .label{color:#fff;text-shadow:0 2px 0 rgba(8,9,22,.6)}
.t-megs .art svg{inset:0;width:100%;height:100%}

*{box-sizing:border-box}
body{margin:0;background:#0f1020;color:#f2f2f7;font-family:system-ui,sans-serif;padding:3rem 1.25rem 4rem}
.page{max-width:900px;margin:0 auto}
.head{text-align:center;margin-bottom:2.25rem}
.mark{font-size:clamp(2.4rem,8vw,3.6rem);font-weight:800;letter-spacing:-.035em;margin:0;line-height:1}
.mark b{color:#3b6ef5}
.tagline{color:#a3a3b8;font-size:1rem;margin:.6rem 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;border-radius:15px;aspect-ratio:306/115;display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #22243f;transition:transform .12s ease,border-color .12s ease}
.tile:hover{transform:translateY(-2px);border-color:#3b6ef5}
.label{position:relative;z-index:2;font-size:clamp(1.4rem,3.2vw,1.95rem);font-weight:800;letter-spacing:-.03em;text-align:center;padding:0 1rem}
.art{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.art svg{position:absolute}
.t-goose{background:linear-gradient(135deg,#17301f 0%,#1d4430 55%,#2d6b47 100%)}
.t-goose .label{color:#eafff2}
.gs1{width:150px;left:-10px;bottom:-26px;opacity:.3}
.gs2{width:96px;right:6px;top:-18px;opacity:.18;transform:scaleX(-1)}
.ripple{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.14)}
.r1{width:54px;height:16px;left:22%;bottom:16%}
.r2{width:34px;height:10px;right:26%;bottom:26%}
.t-2048{background:linear-gradient(135deg,#33200f 0%,#553212 60%,#7a4712 100%)}
.t-2048 .label{color:#fff3d6}
.nt{position:absolute;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:#16182e;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.n1{left:6%;top:13%;background:linear-gradient(160deg,#8be9ff,#38bdf8);transform:rotate(-8deg)}
.n2{left:15%;bottom:11%;background:linear-gradient(160deg,#86f0c0,#34d399);transform:rotate(6deg)}
.n3{right:14%;top:11%;background:linear-gradient(160deg,#ffe066,#fbbf24);transform:rotate(7deg)}
.n4{right:5%;bottom:13%;background:linear-gradient(160deg,#d08cff,#a855f7);color:#fff;font-size:.95rem;transform:rotate(-6deg)}
.t-clicker{background:linear-gradient(135deg,#241d46 0%,#3b2a63 60%,#5c3580 100%)}
.t-clicker .label{color:#fdf6e8}
.ghost{position:absolute;font-weight:800;color:rgba(255,255,255,.075);letter-spacing:-.05em;line-height:.8}
.g1{font-size:9rem;left:-1.5rem;top:-.6rem}
.g2{font-size:9rem;right:-1.5rem;bottom:-2.2rem}
.coin{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffe9a8,#f5c344 62%,#d79a1d);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.k1{width:26px;height:26px;left:16%;bottom:16%}
.k2{width:16px;height:16px;left:27%;top:19%}
.k3{width:11px;height:11px;right:22%;top:28%}
.t-calc{background:linear-gradient(135deg,#141730 0%,#1d2142 100%)}
.t-calc .label{color:#eaf0ff}
.keys{position:absolute;right:1.1rem;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(3,20px);gap:5px}
.keys i{display:block;height:20px;border-radius:6px;background:#242848;border:1px solid #32376a}
.keys i.hot{background:#3b6ef5;border-color:#3b6ef5}
.keys2{left:1.1rem;right:auto}
.t-locked{background:#141528;border-style:dashed;border-color:#2a2c4a;cursor:default}
.t-locked:hover{transform:none;border-color:#2a2c4a}
.t-locked .label{color:#4e5070;font-size:2.2rem;letter-spacing:.12em}
.sub{position:absolute;bottom:.85rem;left:0;right:0;text-align:center;font-size:.72rem;color:#3f4160;letter-spacing:.06em;z-index:2}
.foot{margin-top:2.5rem;text-align:center;color:#6f7190;font-size:.88rem;line-height:1.7}
.foot a{color:#8ea6f0;text-decoration:none}
.foot a:hover{text-decoration:underline}

#gate{position:fixed;inset:0;z-index:50;background:#0f1020;display:flex;align-items:center;justify-content:center;padding:1.5rem}
#gate .box{width:100%;max-width:300px;text-align:center}
#gate .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:1.6px;font-weight:700;color:#6f7190;margin-bottom:1.1rem}
#code{width:100%;padding:1rem;border-radius:14px;border:1px solid #22243f;background:#16182e;color:#f2f2f7;font-family:inherit;font-size:1.6rem;font-weight:700;text-align:center;letter-spacing:.45em;text-indent:.45em;outline:none}
#code:focus{border-color:#3b6ef5}
#go{width:100%;margin-top:.6rem;padding:.85rem;border-radius:14px;border:1px solid #3b6ef5;background:#3b6ef5;color:#fff;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer}
#err{min-height:1.2em;margin-top:.7rem;font-size:.82rem;color:#e6705e}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.locked body{overflow:hidden}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="lbl">Enter passcode</div>
    <input id="code" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Passcode">
    <button id="go">Enter</button>
    <div id="err"></div>
  </div>
</div>

<div class="page" id="site" hidden>

  <div class="head">
    <h1 class="mark">Argyle<b>Smarts</b></h1>
    <p class="tagline">small games and little tools</p>
  </div>

  <div class="grid">
<a class="tile t-megs" href="/megs/">
<div class="art">
<svg viewBox="0 0 306 115" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M0 71V54h12v-9h9v14h11V42h9v12h12v17zM118 71V58h10V47h8v24zM166 71V51h9v9h11v11zM286 71V50h8v-8h12v29z" fill="#10132b" opacity=".8"/><path d="M-10 109C60 85 246 85 316 109" stroke="#eef0fa" stroke-opacity=".4" stroke-width="2"/><rect x="222" y="33" width="58" height="43" fill="#0c0e20" opacity=".6"/><path d="M232 35v40M242 35v40M252 35v40M262 35v40M272 35v40M224 43h54M224 53h54M224 63h54" stroke="#fff" stroke-opacity=".45" stroke-width=".9"/><path d="M222 76V33h58v43" stroke="#f6f7fb" stroke-width="4.5"/><path d="M100 86C146 72 204 56 250 48" stroke="#ffd23b" stroke-width="2.5" stroke-dasharray="2 8" opacity=".9"/><circle cx="262" cy="46" r="8" fill="#f7f7fa" stroke="#0b0c1c" stroke-width="1.8"/><path d="M262 42l3.5 2.6-1.3 4h-4.4l-1.3-4z" fill="#17171c"/><ellipse cx="62" cy="101" rx="22" ry="4" fill="#000" opacity=".28"/><path d="M56 76l-3 21" stroke="#f2f2f7" stroke-width="7"/><path d="M53 98l-7 1" stroke="#17171c" stroke-width="6"/><path d="M57 71l-1 9" stroke="#1f2a55" stroke-width="9.5"/><path d="M76 82l14 4" stroke="#f2f2f7" stroke-width="7"/><path d="M90 86l7-1" stroke="#17171c" stroke-width="6"/><path d="M64 72l12 10" stroke="#1f2a55" stroke-width="9.5"/><path d="M49 55l-10 11M67 55l12-7" stroke="#e8b98f" stroke-width="5.5"/><path d="M48 50h20l2 24H46z" fill="#3b6ef5" stroke="#0b0c1c" stroke-width="2"/><circle cx="58" cy="38" r="10" fill="#e8b98f" stroke="#0b0c1c" stroke-width="2"/><path d="M48.5 36.5a9.5 9.5 0 0119 0z" fill="#1b1b1f"/></svg>
</div>
<span class="label">Megs</span>
</a>
<a class="tile t-mem" href="/memory/">
<div class="art">
<span class="mc mc1"><svg viewBox="0 0 24 24"><path fill="#ffd45e" d="M12 2.2l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.27l-5.9 3.1 1.13-6.57-4.78-4.66 6.6-.96z"/></svg></span>
<span class="mc mc2"><svg viewBox="0 0 24 24"><path fill="#ffd45e" d="M12 2.2l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.27l-5.9 3.1 1.13-6.57-4.78-4.66 6.6-.96z"/></svg></span>
<span class="mc mc3"></span>
</div>
<span class="label">Memory Match</span>
</a>
<a class="tile t-snake" href="/snake/">
<div class="art">
<svg viewBox="0 0 306 115" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 86H56V38H92" stroke="#2a55d4" stroke-width="23"/><path d="M-14 86H56V38H92" stroke="#4e7cf6" stroke-width="16"/><circle cx="94" cy="31" r="4.6" fill="#fff"/><circle cx="94" cy="45" r="4.6" fill="#fff"/><circle cx="95.6" cy="31" r="2.3" fill="#16182e"/><circle cx="95.6" cy="45" r="2.3" fill="#16182e"/><ellipse cx="252" cy="78" rx="11" ry="3.2" fill="#000" opacity=".13"/><circle cx="252" cy="60" r="14" fill="#e8312f"/><circle cx="247" cy="55" r="3.4" fill="#fff" opacity=".5"/><path d="M252 48c0-4 2-6 4-7" stroke="#5b3a1a" stroke-width="3"/><ellipse cx="260" cy="43" rx="5.5" ry="3" fill="#3fb950" transform="rotate(-25 260 43)"/></svg>
</div>
<span class="label">Snake</span>
</a>
<a class="tile t-2048" href="/2048/">
<div class="art"><span class="nt n1">2</span><span class="nt n2">4</span><span class="nt n3">8</span><span class="nt n4">128</span></div>
<span class="label">2048</span>
</a>


    <a class="tile t-goose" href="/goose/">
      <div class="art">
        <svg class="gs1" viewBox="0 0 200 200" fill="none"><ellipse cx="108" cy="132" rx="62" ry="42" fill="#ffffff"/><path d="M96 102C84 72 86 48 104 40c18-8 34 4 34 20" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/><circle cx="138" cy="58" r="18" fill="#ffffff"/><path d="M152 56l22 6-22 8z" fill="#f0a93b"/><circle cx="143" cy="53" r="3.2" fill="#15241a"/><path d="M86 128c22-12 44-8 62-4-24 26-50 18-62 4z" fill="#d9d9d9"/></svg>
        <svg class="gs2" viewBox="0 0 200 200" fill="none"><ellipse cx="108" cy="132" rx="62" ry="42" fill="#ffffff"/><path d="M96 102C84 72 86 48 104 40c18-8 34 4 34 20" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/><circle cx="138" cy="58" r="18" fill="#ffffff"/><path d="M152 56l22 6-22 8z" fill="#f0a93b"/></svg>
        <span class="ripple r1"></span>
        <span class="ripple r2"></span>
      </div>
      <span class="label">Goose Clicker</span>
    </a>

    <a class="tile t-calc" href="/calculator/">
      <div class="art">
        <span class="keys"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="hot"></i></span>
        <span class="keys keys2"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <span class="label">Calculator</span>
    </a>

    <div class="tile t-locked" id="slot">
      <span class="label">???</span>
      <span class="sub">one game is hidden somewhere on this site</span>
    </div>

  </div>

  <p class="foot">Hi, I'm Hudson. Small games and tools I build for fun.<br>
  Sister site to <a href="https://hudson.party">hudson.party</a>.</p>

</div>

<script>
(function(){
  "use strict";
  var PASS = "6814";
  var PKEY = "argyle.pass";
  var gate = document.getElementById("gate");
  var site = document.getElementById("site");
  var code = document.getElementById("code");
  var err = document.getElementById("err");

  function open(){
    gate.remove();
    site.hidden = false;
    reveal();
  }
  function reveal(){
    var on = false;
    try{ on = localStorage.getItem("argyle.secret67") === "1"; }catch(e){}
    if(!on) return;
    var slot = document.getElementById("slot");
    if(!slot) return;
    var a = document.createElement("a");
    a.className = "tile t-clicker";
    a.href = "/67clicker/";
    a.innerHTML =
      '<div class="art">' +
        '<span class="ghost g1">67</span>' +
        '<span class="ghost g2">67</span>' +
        '<span class="coin k1"></span>' +
        '<span class="coin k2"></span>' +
        '<span class="coin k3"></span>' +
      '</div>' +
      '<span class="label">67 Clicker</span>';
    slot.parentNode.replaceChild(a, slot);
  }
  function tryCode(){
    if(code.value.trim() === PASS){
      try{ sessionStorage.setItem(PKEY, "1"); }catch(e){}
      open();
    } else {
      err.textContent = "Not that one.";
      gate.querySelector(".box").classList.remove("shake");
      void gate.offsetWidth;
      gate.querySelector(".box").classList.add("shake");
      code.value = "";
      code.focus();
    }
  }

  var already = false;
  try{ localStorage.removeItem(PKEY); }catch(e){}
  try{ already = sessionStorage.getItem(PKEY) === "1"; }catch(e){}
  if(already){ open(); return; }

  document.getElementById("go").addEventListener("click", tryCode);
  code.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); tryCode(); }
  });
  code.addEventListener("input", function(){
    err.textContent = "";
    if(code.value.length === 4) tryCode();
  });
  code.focus();
})();
</script>
</body>
</html>
