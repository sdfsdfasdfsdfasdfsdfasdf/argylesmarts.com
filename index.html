<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argyle Smarts</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1020;color:#f2f2f7;font-family:system-ui,sans-serif;padding:2rem 1rem}
.card{width:100%;max-width:520px;text-align:center}
h1{font-size:clamp(2.2rem,7vw,3.6rem);margin:0 0 .4rem;letter-spacing:-.025em}
.tag{color:#a3a3b8;margin:0 0 2.25rem;font-size:1.05rem}
.links{display:grid;gap:.75rem}
a.tile{display:flex;align-items:center;gap:1rem;text-align:left;text-decoration:none;color:inherit;background:#16182e;border:1px solid #22243f;border-radius:14px;padding:1rem 1.1rem;transition:border-color .15s,transform .1s}
a.tile:hover{border-color:#3b6ef5;transform:translateY(-1px)}
.ico{font-size:1.6rem;font-weight:800;flex:none;width:2.6rem;text-align:center;color:#9ab6ff}
.txt{flex:1;min-width:0}
.t{display:block;font-weight:650;font-size:1.02rem}
.d{display:block;color:#8a8ca8;font-size:.85rem;margin-top:.15rem}
footer{color:#5c5e7a;font-size:.78rem;margin-top:2.25rem}
</style>
</head>
<body>
<div class="card">
  <h1>Argyle Smarts</h1>
  <p class="tag">Small games and small tools.</p>

  <div class="links">
    <a class="tile" href="/67clicker/">
      <span class="ico">67</span>
      <span class="txt">
        <span class="t">67 Clicker</span>
        <span class="d">Click the 67. Buy upgrades. Watch it get strange.</span>
      </span>
    </a>
    <a class="tile" href="/calculator/">
      <span class="ico">=</span>
      <span class="txt">
        <span class="t">Calculator</span>
        <span class="d">Adds, subtracts, multiplies, divides. That is all.</span>
      </span>
    </a>
  </div>

  <footer>More coming.</footer>
</div>
</body>
</html>
