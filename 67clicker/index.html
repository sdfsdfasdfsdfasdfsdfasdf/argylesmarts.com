<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>67 Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf7f2;color:#1b1523;font-family:Inter,sans-serif;padding:2rem 1.25rem 3rem}
.page{max-width:1060px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.mark{font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.5px;margin:0}
.mark b{color:#4a7af5}
.back{font-size:14px;font-weight:500;color:#6e667c;text-decoration:none}
.back:hover{color:#4a7af5}
.wrap{display:grid;grid-template-columns:1fr 348px;gap:12px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;overflow:hidden;border-radius:22px;padding:1.6rem;min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#2b2350 0%,#43306e 55%,#6d3f8e 100%);box-shadow:0 14px 30px -14px rgba(50,30,90,.6)}
.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;margin:0 0 .75rem;color:#c3b4e8}
#bank{font-family:Fredoka,sans-serif;font-size:2.7rem;font-weight:700;letter-spacing:-.5px;margin:0;color:#fdf6e8;text-align:center}
#bank small{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#b9a9e0;margin-top:.15rem}
#rate{color:#cdc3e4;margin:.6rem 0 1.6rem;font-size:13px;font-family:"Space Mono",monospace;font-weight:700}
#sixtyseven{font-family:Fredoka,sans-serif;font-size:7rem;font-weight:700;cursor:pointer;user-select:none;line-height:1;padding:.7rem 1.6rem;border-radius:22px;transition:transform .06s ease;background:none;border:none;color:#fdf6e8;letter-spacing:-.03em}
#sixtyseven:active{transform:scale(.94)}
.hint{color:#a496cc;font-size:13px;margin-top:1.4rem;text-align:center}
.float{position:absolute;pointer-events:none;font-family:Fredoka,sans-serif;font-weight:700;animation:rise 1s ease-out forwards;color:#ffd45e;font-size:1.1rem}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
.shop{background:#fff;border:1.5px solid #ece5d9;border-radius:22px;padding:1.1rem;box-shadow:0 14px 30px -18px rgba(120,100,70,.35)}
.tabs{display:flex;gap:.4rem;margin-bottom:.9rem}
.tab{flex:1;padding:.55rem;border-radius:11px;border:1.5px solid #ece5d9;background:#faf7f2;color:#6e667c;cursor:pointer;font-size:12px;font-weight:600;font-family:Inter,sans-serif}
.tab.on{background:#4a7af5;color:#fff;border-color:#4a7af5}
.item{width:100%;text-align:left;display:flex;gap:.7rem;align-items:center;background:#faf7f2;border:1.5px solid #efe8dc;border-radius:14px;padding:.65rem .75rem;margin-bottom:.45rem;cursor:pointer;color:inherit;font-family:Inter,sans-serif}
.item:disabled{opacity:.5;cursor:not-allowed}
.item:not(:disabled):hover{border-color:#4a7af5;background:#fff}
.ico{font-size:1.35rem;width:2rem;text-align:center;flex:none}
.meta{flex:1;min-width:0}
.name{font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;color:#1b1523}
.desc{color:#8b8295;font-size:11.5px;margin-top:.1rem;line-height:1.35}
.cost{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;color:#1f9d5a;flex:none}
.cost.no{color:#c96a56}
.owned{font-family:"Space Mono",monospace;font-size:11px;color:#9a91a5;flex:none;margin-left:.3rem}
.locked .name,.locked .desc{filter:blur(3px)}
.reset{background:none;border:1.5px solid #e6ddd0;color:#8b8295;border-radius:50px;padding:.4rem .9rem;cursor:pointer;font-size:12px;font-family:Inter,sans-serif;font-weight:500}
.reset:hover{border-color:#c96a56;color:#c96a56}
.foot{margin-top:2rem;padding-top:1.2rem;border-top:1px solid #e8e1d6;font-size:13px;color:#8b8295}
.s-gold{color:#ffd45e !important;text-shadow:0 0 26px rgba(255,212,94,.5)}
.s-neon{color:#5ee6a8 !important;text-shadow:0 0 12px #5ee6a8,0 0 36px rgba(94,230,168,.6)}
.s-rainbow{background:linear-gradient(92deg,#ff5e7a,#ffd45e,#5ee6a8,#5ea8ff,#b45eff);-webkit-background-clip:text;background-clip:text;color:transparent !important;filter:drop-shadow(0 0 16px rgba(180,94,255,.4))}
.s-glitch{color:#fff !important;text-shadow:2px 0 #ff2d6f,-2px 0 #00e5ff;animation:gl .9s infinite steps(2)}
@keyframes gl{50%{text-shadow:-2px 0 #ff2d6f,2px 0 #00e5ff}}
.s-fire{color:#ffb04a !important;text-shadow:0 -4px 14px #ff4d2d,0 -14px 26px rgba(255,120,30,.6);animation:fl .6s ease-in-out infinite alternate}
@keyframes fl{to{text-shadow:0 -6px 20px #ff4d2d,0 -20px 34px rgba(255,160,40,.75)}}
.s-cosmic{background:conic-gradient(from 0deg,#b45eff,#5ea8ff,#5ee6a8,#ffd45e,#b45eff);-webkit-background-clip:text;background-clip:text;color:transparent !important;animation:spin 7s linear infinite;filter:drop-shadow(0 0 20px rgba(94,168,255,.5))}
@keyframes spin{to{filter:drop-shadow(0 0 20px rgba(180,94,255,.6)) hue-rotate(360deg)}}
.f-serif{font-family:Georgia,serif !important}
.f-mono{font-family:"Space Mono",monospace !important}
.big1{font-size:8.5rem !important}.big2{font-size:10rem !important}.big3{font-size:11.5rem !important}
</style>
</head>
<body>
<div class="page">

<div class="top">
<h1 class="mark">Argyle<b>.Smarts</b></h1>
<a class="back" href="/">&larr; all games</a>
</div>

<div class="wrap">
  <div class="stage">
    <p class="eyebrow">Idle &middot; Twenty-six upgrades</p>
    <p id="bank">$0<small>67 dollars</small></p>
    <div id="rate">0 / sec</div>
    <button id="sixtyseven">67</button>
    <div class="hint">Click the 67. Buy upgrades. Make it weirder.</div>
  </div>

  <div class="shop">
    <div class="tabs">
      <button class="tab on" data-tab="gen">Workers</button>
      <button class="tab" data-tab="clk">Clicks</button>
      <button class="tab" data-tab="skin">Looks</button>
    </div>
    <div id="shop"></div>
    <div style="margin-top:.9rem;text-align:right"><button class="reset" id="reset">Reset save</button></div>
  </div>
</div>

<p class="foot">Numbers go up. That is the whole thing.</p>

</div>
<script>
(function(){
"use strict";

var GENS = [
  {id:"friend", ico:"🧑", name:"Friend who also says 67", desc:"Says it for you.", cost:15, cps:0.5},
  {id:"calc", ico:"🔢", name:"Calculator", desc:"Permanently displays 67.", cost:120, cps:3},
  {id:"choir", ico:"🎤", name:"67 Choir", desc:"Six people, seven voices.", cost:900, cps:14},
  {id:"bus", ico:"🚌", name:"Route 67 Bus", desc:"Hauls 67s across town.", cost:7500, cps:85},
  {id:"lab", ico:"🧪", name:"67 Lab", desc:"Synthesizes fresh 67s.", cost:62000, cps:520},
  {id:"factory", ico:"🏭", name:"67 Factory", desc:"Industrial-grade sixty-seven.", cost:500000, cps:3400},
  {id:"portal", ico:"🌀", name:"Portal to 67", desc:"It is 67 on the other side.", cost:4200000, cps:22000},
  {id:"planet", ico:"🪐", name:"Planet 67", desc:"Entire world, one number.", cost:36000000, cps:160000}
];

var CLICKS = [
  {id:"c1", ico:"👆", name:"Stronger Finger", desc:"Clicks are worth double.", cost:100, mult:2},
  {id:"c2", ico:"✌️", name:"Two Fingers", desc:"Double again.", cost:1200, mult:2},
  {id:"c3", ico:"🖐️", name:"Whole Hand", desc:"Triple this time.", cost:18000, mult:3},
  {id:"c4", ico:"🤚", name:"Both Hands", desc:"Triple again.", cost:260000, mult:3},
  {id:"c5", ico:"⚡", name:"Lightning Tap", desc:"Five times.", cost:4000000, mult:5},
  {id:"c6", ico:"🌋", name:"Tectonic Tap", desc:"Ten times.", cost:70000000, mult:10}
];

var SKINS = [
  {id:"plain", ico:"⚪", name:"Plain 67", desc:"How it started.", cost:0, cls:""},
  {id:"gold", ico:"🥇", name:"Gold 67", desc:"Shiny and smug.", cost:500, cls:"s-gold"},
  {id:"serif", ico:"📜", name:"Fancy 67", desc:"Serif. Very formal.", cost:2500, cls:"f-serif"},
  {id:"neon", ico:"💡", name:"Neon 67", desc:"Glows in the dark.", cost:9000, cls:"s-neon"},
  {id:"big1", ico:"🔍", name:"Bigger 67", desc:"Just larger.", cost:30000, cls:"big1"},
  {id:"mono", ico:"💻", name:"Hacker 67", desc:"Monospace energy.", cost:90000, cls:"f-mono"},
  {id:"rainbow", ico:"🌈", name:"Rainbow 67", desc:"All the colors.", cost:400000, cls:"s-rainbow"},
  {id:"big2", ico:"📏", name:"Huge 67", desc:"Even larger.", cost:1500000, cls:"big2"},
  {id:"glitch", ico:"👾", name:"Glitch 67", desc:"Something is wrong.", cost:6000000, cls:"s-glitch"},
  {id:"fire", ico:"🔥", name:"Flaming 67", desc:"It is on fire.", cost:25000000, cls:"s-fire"},
  {id:"big3", ico:"🌌", name:"Massive 67", desc:"Absurdly large.", cost:120000000, cls:"big3"},
  {id:"cosmic", ico:"✨", name:"Cosmic 67", desc:"Transcendent 67.", cost:900000000, cls:"s-cosmic"}
];

var KEY = "sixtyseven.save.v1";
var S = {bank:0, total:0, gens:{}, clicks:{}, skins:{plain:1}, skin:"plain"};

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(o && typeof o === "object"){
      S.bank = +o.bank || 0;
      S.total = +o.total || 0;
      S.gens = o.gens || {};
      S.clicks = o.clicks || {};
      S.skins = o.skins || {plain:1};
      S.skins.plain = 1;
      S.skin = o.skin || "plain";
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

function fmt(n){
  if(n < 1000) return (Math.floor(n*10)/10).toString().replace(/\.0$/,"");
  var u = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"], i = 0;
  while(n >= 1000 && i < u.length-1){ n /= 1000; i++; }
  return (Math.round(n*100)/100) + u[i];
}
function genCost(g){ return Math.ceil(g.cost * Math.pow(1.15, S.gens[g.id] || 0)); }
function perSec(){
  var t = 0;
  for(var i=0;i<GENS.length;i++){ t += (S.gens[GENS[i].id]||0) * GENS[i].cps; }
  return t;
}
function perClick(){
  var m = 1;
  for(var i=0;i<CLICKS.length;i++){ if(S.clicks[CLICKS[i].id]) m *= CLICKS[i].mult; }
  return m;
}

var elBank = document.getElementById("bank");
var elRate = document.getElementById("rate");
var el67 = document.getElementById("sixtyseven");
var elShop = document.getElementById("shop");
var stage = document.querySelector(".stage");
var tab = "gen";

function applySkin(){
  var s = null;
  for(var i=0;i<SKINS.length;i++){ if(SKINS[i].id === S.skin) s = SKINS[i]; }
  el67.className = "";
  if(s && s.cls) el67.className = s.cls;
}

function paintTop(){
  elBank.innerHTML = "$" + fmt(S.bank) + "<small>67 dollars</small>";
  elRate.textContent = fmt(perSec()) + " / sec  ·  " + fmt(perClick()) + " per click";
}

function row(opts){
  var b = document.createElement("button");
  b.className = "item" + (opts.locked ? " locked" : "");
  b.disabled = !!opts.disabled;
  var right = opts.ownedText ? '<span class="owned">' + opts.ownedText + '</span>' : "";
  b.innerHTML =
    '<span class="ico">' + opts.ico + '</span>' +
    '<span class="meta"><span class="name">' + opts.name + '</span>' +
    '<span class="desc">' + opts.desc + '</span></span>' +
    '<span class="cost' + (opts.afford ? "" : " no") + '">' + opts.costText + '</span>' + right;
  if(opts.onclick) b.addEventListener("click", opts.onclick);
  return b;
}
function paintShop(){
  elShop.innerHTML = "";
  var i;
  if(tab === "gen"){
    for(i=0;i<GENS.length;i++){
      (function(g){
        var owned = S.gens[g.id] || 0;
        var c = genCost(g);
        var seen = owned > 0 || S.total >= g.cost * 0.4;
        elShop.appendChild(row({
          ico: seen ? g.ico : "❓",
          name: seen ? g.name : "???",
          desc: seen ? g.desc + " (+" + fmt(g.cps) + "/sec)" : "Keep clicking.",
          costText: seen ? "$" + fmt(c) : "—",
          afford: S.bank >= c,
          disabled: !seen || S.bank < c,
          locked: !seen,
          ownedText: owned ? String(owned) : "",
          onclick: function(){
            var cost = genCost(g);
            if(S.bank < cost) return;
            S.bank -= cost;
            S.gens[g.id] = (S.gens[g.id] || 0) + 1;
            save(); paintTop(); paintShop();
          }
        }));
      })(GENS[i]);
    }
  } else if(tab === "clk"){
    for(i=0;i<CLICKS.length;i++){
      (function(u){
        var have = !!S.clicks[u.id];
        var seen = have || S.total >= u.cost * 0.3;
        elShop.appendChild(row({
          ico: seen ? u.ico : "❓",
          name: seen ? u.name : "???",
          desc: seen ? u.desc : "Keep clicking.",
          costText: have ? "owned" : (seen ? "$" + fmt(u.cost) : "—"),
          afford: have || S.bank >= u.cost,
          disabled: have || !seen || S.bank < u.cost,
          locked: !seen,
          onclick: function(){
            if(S.clicks[u.id] || S.bank < u.cost) return;
            S.bank -= u.cost;
            S.clicks[u.id] = 1;
            save(); paintTop(); paintShop();
          }
        }));
      })(CLICKS[i]);
    }
  } else {
    for(i=0;i<SKINS.length;i++){
      (function(sk){
        var have = !!S.skins[sk.id];
        var on = S.skin === sk.id;
        elShop.appendChild(row({
          ico: sk.ico,
          name: sk.name,
          desc: sk.desc,
          costText: on ? "equipped" : (have ? "equip" : "$" + fmt(sk.cost)),
          afford: have || S.bank >= sk.cost,
          disabled: on || (!have && S.bank < sk.cost),
          onclick: function(){
            if(!S.skins[sk.id]){
              if(S.bank < sk.cost) return;
              S.bank -= sk.cost;
              S.skins[sk.id] = 1;
            }
            S.skin = sk.id;
            applySkin(); save(); paintTop(); paintShop();
          }
        }));
      })(SKINS[i]);
    }
  }
}

el67.addEventListener("click", function(ev){
  var gain = perClick();
  S.bank += gain; S.total += gain;
  var f = document.createElement("span");
  f.className = "float";
  f.textContent = "+$" + fmt(gain);
  var r = stage.getBoundingClientRect();
  f.style.left = (ev.clientX - r.left - 12) + "px";
  f.style.top = (ev.clientY - r.top - 18) + "px";
  stage.appendChild(f);
  setTimeout(function(){ f.remove(); }, 1000);
  paintTop();
});

var tabs = document.querySelectorAll(".tab");
for(var t=0;t<tabs.length;t++){
  tabs[t].addEventListener("click", function(){
    for(var k=0;k<tabs.length;k++) tabs[k].classList.remove("on");
    this.classList.add("on");
    tab = this.getAttribute("data-tab");
    paintShop();
  });
}

document.getElementById("reset").addEventListener("click", function(){
  if(!confirm("Wipe your save and start over?")) return;
  S = {bank:0, total:0, gens:{}, clicks:{}, skins:{plain:1}, skin:"plain"};
  applySkin(); save(); paintTop(); paintShop();
});

var last = Date.now();
setInterval(function(){
  var now = Date.now();
  var dt = Math.min((now - last) / 1000, 5);
  last = now;
  var g = perSec() * dt;
  if(g > 0){ S.bank += g; S.total += g; paintTop(); }
}, 100);

setInterval(paintShop, 500);
setInterval(save, 5000);
window.addEventListener("beforeunload", save);

load(); applySkin(); paintTop(); paintShop();
})();
</script>
</body>
</html>
