<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1020;color:#f2f2f7;font-family:system-ui,sans-serif;min-height:100vh}
a{color:#7aa2ff}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #22243f}
header h1{font-size:1.1rem;margin:0}
.wrap{max-width:360px;margin:2.5rem auto;padding:0 1rem}
.screen{background:#16182e;border:1px solid #22243f;border-radius:14px;padding:1.1rem 1.1rem 1.2rem;text-align:right;margin-bottom:.75rem}
#sub{color:#6f7190;font-size:.9rem;min-height:1.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
button{font-family:inherit;font-size:1.25rem;font-weight:600;padding:1rem 0;border-radius:12px;border:1px solid #22243f;background:#1b1e36;color:#f2f2f7;cursor:pointer;transition:filter .1s}
button:hover{filter:brightness(1.25)}
button:active{filter:brightness(.85)}
.op{background:#242848;color:#9ab6ff}
.eq{background:#3b6ef5;border-color:#3b6ef5;color:#fff}
.fn{background:#141730;color:#a3a3b8}
.wide{grid-column:span 2}
.note{color:#6f7190;font-size:.8rem;text-align:center;margin-top:1.1rem}
#secret{margin-top:1.25rem;padding:.9rem 1rem;border-radius:12px;border:1px solid #2f5a3f;background:#13241b;text-align:center;animation:pop .35s ease-out}
#secret .k{display:block;font-size:.72rem;letter-spacing:1.4px;text-transform:uppercase;color:#5ee6a8;font-weight:700;margin-bottom:.3rem}
#secret a{font-weight:600;color:#9af5c8}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<header>
<h1>Calculator</h1>
<a href="/">&larr; all games</a>
</header>

<div class="wrap">
  <div class="screen">
    <div id="sub"></div>
    <div id="main">0</div>
  </div>
  <div class="pad">
    <button class="fn" data-k="clear">AC</button>
    <button class="fn" data-k="sign">+/-</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="/">&divide;</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*">&times;</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-">&minus;</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button class="wide" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
  <p class="note">Keyboard works too. Esc clears, Backspace deletes.</p>

  <div id="secret" hidden>
    <span class="k">You found it</span>
    <a href="/67clicker/">67 Clicker is unlocked &rarr;</a>
  </div>
</div>

<script>
(function(){
"use strict";
var cur = "0";
var prev = null;
var op = null;
var fresh = true;

var elMain = document.getElementById("main");
var elSub = document.getElementById("sub");
var elSecret = document.getElementById("secret");
var UKEY = "argyle.secret67";

function unlocked(){
  try{ return localStorage.getItem(UKEY) === "1"; }catch(e){ return false; }
}
function unlock(){
  try{ localStorage.setItem(UKEY, "1"); }catch(e){}
  if(elSecret) elSecret.hidden = false;
}
function checkSecret(){
  if(cur === "6767") unlock();
}

function show(){
  elMain.textContent = cur;
  elSub.textContent = (prev === null) ? "" : trim(prev) + " " + symbol(op);
  checkSecret();
}
function symbol(o){
  return o === "*" ? "×" : o === "/" ? "÷" : o === "-" ? "−" : o === "+" ? "+" : "";
}
function trim(n){
  if(!isFinite(n)) return "Error";
  var s = Math.round(n * 1e12) / 1e12;
  s = String(s);
  if(s.indexOf("e") === -1 && s.replace("-","").replace(".","").length > 14){
    s = Number(n).toPrecision(12).replace(/0+$/,"").replace(/\.$/,"");
  }
  return s;
}
function digit(d){
  if(fresh){ cur = (d === ".") ? "0." : d; fresh = false; }
  else if(d === "."){ if(cur.indexOf(".") === -1) cur += "."; }
  else if(cur === "0"){ cur = d; }
  else if(cur === "-0"){ cur = "-" + d; }
  else { cur += d; }
  show();
}
function apply(a, o, b){
  if(o === "+") return a + b;
  if(o === "-") return a - b;
  if(o === "*") return a * b;
  if(o === "/") return b === 0 ? NaN : a / b;
  return b;
}
function setOp(nextOp){
  var val = parseFloat(cur);
  if(prev !== null && op && !fresh){
    val = apply(prev, op, val);
    cur = trim(val);
  }
  prev = isFinite(val) ? val : null;
  if(!isFinite(val)) cur = "Error";
  op = nextOp;
  fresh = true;
  show();
}
function equals(){
  if(op === null || prev === null) return;
  var val = apply(prev, op, parseFloat(cur));
  cur = trim(val);
  prev = null; op = null; fresh = true;
  show();
}
function clearAll(){ cur = "0"; prev = null; op = null; fresh = true; show(); }
function sign(){
  if(cur === "0" || cur === "Error") return;
  cur = (cur.charAt(0) === "-") ? cur.slice(1) : "-" + cur;
  show();
}
function percent(){
  var v = parseFloat(cur) / 100;
  cur = trim(v); fresh = true; show();
}
function back(){
  if(fresh || cur === "Error") return;
  cur = cur.length > 1 ? cur.slice(0, -1) : "0";
  if(cur === "-") cur = "0";
  show();
}
function press(k){
  if(k === "clear") return clearAll();
  if(k === "sign") return sign();
  if(k === "pct") return percent();
  if(k === "=") return equals();
  if(k === "+" || k === "-" || k === "*" || k === "/") return setOp(k);
  if(cur === "Error") clearAll();
  digit(k);
}

var btns = document.querySelectorAll("[data-k]");
for(var i = 0; i < btns.length; i++){
  btns[i].addEventListener("click", function(){ this.blur(); press(this.getAttribute("data-k")); });
}

document.addEventListener("keydown", function(e){
  var k = e.key;
  if(k >= "0" && k <= "9"){ press(k); }
  else if(k === "."){ press("."); }
  else if(k === "+" || k === "-" || k === "*" || k === "/"){ press(k); }
  else if(k === "Enter" || k === "="){ e.preventDefault(); press("="); }
  else if(k === "Escape"){ press("clear"); }
  else if(k === "Backspace"){ back(); }
  else if(k === "%"){ press("pct"); }
  else return;
});

if(unlocked() && elSecret) elSecret.hidden = false;
show();
})();
</script>
</body>
</html>
