<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf7f2;color:#1b1523;font-family:Inter,sans-serif;padding:2rem 1.25rem 3rem}
.page{max-width:980px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.mark{font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.5px;margin:0}
.mark b{color:#4a7af5}
.back{font-size:14px;font-weight:500;color:#6e667c;text-decoration:none}
.back:hover{color:#4a7af5}
.shell{max-width:380px;margin:1.5rem auto 0}
.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:#9a7137;margin:0 0 .6rem;text-align:center}
.screen{background:linear-gradient(160deg,#fdf1dc 0%,#f6e0bd 100%);border-radius:22px;padding:1.3rem 1.3rem 1.4rem;text-align:right;margin-bottom:.8rem;box-shadow:0 14px 30px -16px rgba(150,110,50,.55)}
#sub{font-family:"Space Mono",monospace;color:#9a7137;font-size:13px;min-height:1.3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{font-family:Fredoka,sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:-.5px;line-height:1.15;color:#3c2a12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
button{font-family:Fredoka,sans-serif;font-size:1.2rem;font-weight:600;padding:1rem 0;border-radius:16px;border:1.5px solid #ece5d9;background:#fff;color:#1b1523;cursor:pointer;transition:transform .08s,border-color .12s}
button:hover{border-color:#4a7af5}
button:active{transform:scale(.95)}
.op{background:#f1ece4;color:#4a7af5}
.eq{background:#4a7af5;border-color:#4a7af5;color:#fff}
.eq:hover{border-color:#2f5fd8;background:#2f5fd8}
.fn{background:#f6f1e9;color:#8b8295;font-size:1rem}
.wide{grid-column:span 2}
.note{color:#8b8295;font-size:13px;text-align:center;margin-top:1.1rem}
.foot{margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid #e8e1d6;font-size:13px;color:#8b8295;text-align:center}
</style>
</head>
<body>
<div class="page">

<div class="top">
<h1 class="mark">Argyle<b>.Smarts</b></h1>
<a class="back" href="/">&larr; all games</a>
</div>

<div class="shell">
  <p class="eyebrow">Tool &middot; Four operations</p>
  <div class="screen">
    <div id="sub"></div>
    <div id="main">0</div>
  </div>
  <div class="pad">
    <button class="fn" data-k="clear">AC</button>
    <button class="fn" data-k="sign">+/-</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="/">&divide;</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*">&times;</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-">&minus;</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button class="wide" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
  <p class="note">Keyboard works too. Esc clears, Backspace deletes.</p>
</div>

<p class="foot">Adds, subtracts, multiplies, divides. That is all.</p>

</div>
<script>
(function(){
"use strict";
var cur = "0";
var prev = null;
var op = null;
var fresh = true;

var elMain = document.getElementById("main");
var elSub = document.getElementById("sub");

function show(){
  elMain.textContent = cur;
  elSub.textContent = (prev === null) ? "" : trim(prev) + " " + symbol(op);
}
function symbol(o){
  return o === "*" ? "×" : o === "/" ? "÷" : o === "-" ? "−" : o === "+" ? "+" : "";
}
function trim(n){
  if(!isFinite(n)) return "Error";
  var s = Math.round(n * 1e12) / 1e12;
  s = String(s);
  if(s.indexOf("e") === -1 && s.replace("-","").replace(".","").length > 14){
    s = Number(n).toPrecision(12).replace(/0+$/,"").replace(/\.$/,"");
  }
  return s;
}
function digit(d){
  if(fresh){ cur = (d === ".") ? "0." : d; fresh = false; }
  else if(d === "."){ if(cur.indexOf(".") === -1) cur += "."; }
  else if(cur === "0"){ cur = d; }
  else if(cur === "-0"){ cur = "-" + d; }
  else { cur += d; }
  show();
}
function apply(a, o, b){
  if(o === "+") return a + b;
  if(o === "-") return a - b;
  if(o === "*") return a * b;
  if(o === "/") return b === 0 ? NaN : a / b;
  return b;
}
function setOp(nextOp){
  var val = parseFloat(cur);
  if(prev !== null && op && !fresh){
    val = apply(prev, op, val);
    cur = trim(val);
  }
  prev = isFinite(val) ? val : null;
  if(!isFinite(val)) cur = "Error";
  op = nextOp;
  fresh = true;
  show();
}
function equals(){
  if(op === null || prev === null) return;
  var val = apply(prev, op, parseFloat(cur));
  cur = trim(val);
  prev = null; op = null; fresh = true;
  show();
}
function clearAll(){ cur = "0"; prev = null; op = null; fresh = true; show(); }
function sign(){
  if(cur === "0" || cur === "Error") return;
  cur = (cur.charAt(0) === "-") ? cur.slice(1) : "-" + cur;
  show();
}
function percent(){
  var v = parseFloat(cur) / 100;
  cur = trim(v); fresh = true; show();
}
function back(){
  if(fresh || cur === "Error") return;
  cur = cur.length > 1 ? cur.slice(0, -1) : "0";
  if(cur === "-") cur = "0";
  show();
}
function press(k){
  if(k === "clear") return clearAll();
  if(k === "sign") return sign();
  if(k === "pct") return percent();
  if(k === "=") return equals();
  if(k === "+" || k === "-" || k === "*" || k === "/") return setOp(k);
  if(cur === "Error") clearAll();
  digit(k);
}

var btns = document.querySelectorAll("[data-k]");
for(var i = 0; i < btns.length; i++){
  btns[i].addEventListener("click", function(){ press(this.getAttribute("data-k")); });
}

document.addEventListener("keydown", function(e){
  var k = e.key;
  if(k >= "0" && k <= "9"){ press(k); }
  else if(k === "."){ press("."); }
  else if(k === "+" || k === "-" || k === "*" || k === "/"){ press(k); }
  else if(k === "Enter" || k === "="){ e.preventDefault(); press("="); }
  else if(k === "Escape"){ press("clear"); }
  else if(k === "Backspace"){ back(); }
  else if(k === "%"){ press("pct"); }
  else return;
});

show();
})();
</script>
</body>
</html>
